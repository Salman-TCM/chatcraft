# Staging environment overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Differences from dev:
#   - ENVIRONMENT=staging, DEBUG=false
#   - No hot-reload volumes (runs built images)
#   - Resource limits on all services
#   - Sentry + Axiom enabled
#   - Seed data runs on first start via SEED_ON_START=true

services:

  backend:
    volumes: !reset []                      # no source-mount; run built image
    ports: !reset []                        # reached via internal network only (frontend proxy)
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      WATCHFILES_FORCE_POLLING: "false"
      SEED_ON_START: "true"                 # entrypoint runs seed_data.py once
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  celery_worker:
    volumes: !reset []
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  celery_beat:
    volumes: !reset []
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  frontend:
    build:
      # TODO: the Dockerfile's "final" stage (output: standalone) has a file-
      # tracing bug that copies zero node_modules into the bundle — root
      # cause not yet found. Running from "builder" (full source + full
      # node_modules already present there) until that's diagnosed.
      target: builder
      args:
        NEXT_PUBLIC_API_URL:                ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL:                 ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_APP_NAME:                 ${NEXT_PUBLIC_APP_NAME:-Tiertech}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:  ${STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_POSTHOG_KEY:             ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST:            ${NEXT_PUBLIC_POSTHOG_HOST:-}
        NEXT_PUBLIC_SENTRY_DSN:              ${NEXT_PUBLIC_SENTRY_DSN:-}
    volumes: !reset []
    ports: !reset []                        # reached via cloudflared over internal network only
    command: npm run start                  # builder stage's WORKDIR is already /app/frontend
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  postgres:
    ports: !reset []                        # no host access needed; internal network only
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis:
    ports: !reset []                        # no host access needed; internal network only
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  clamav:
    ports: !reset []                        # only used internally by backend

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — exposes the frontend at tiertech.com.bd with no
  # inbound ports opened on the host. Public hostname -> service mapping is
  # configured in the Cloudflare Zero Trust dashboard (dashboard/token-based
  # tunnel), not here.
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    # Must be on the same network as nginx so it can resolve `nginx` by name.
    # The Cloudflare Zero Trust dashboard ingress now routes to http://nginx:80,
    # which means nginx owns TLS termination and blue/green switching.
    networks: [edge]
    depends_on:
      nginx:
        condition: service_started
