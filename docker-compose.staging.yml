# Staging environment overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Differences from dev:
#   - ENVIRONMENT=staging, DEBUG=false
#   - No hot-reload volumes (runs built images)
#   - Resource limits on all services
#   - Sentry + Axiom enabled
#   - Seed data runs on first start via SEED_ON_START=true

services:

  backend:
    volumes: []                             # no source-mount; run built image
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      WATCHFILES_FORCE_POLLING: "false"
      SEED_ON_START: "true"                 # entrypoint runs seed_data.py once
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  celery_worker:
    volumes: []
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  celery_beat:
    volumes: []
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  frontend:
    volumes: []
    command: sh -c "cd frontend && npm run start"   # run built Next.js, not dev server
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  postgres:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — exposes the frontend at tiertech.com.bd with no
  # inbound ports opened on the host. Public hostname -> service mapping is
  # configured in the Cloudflare Zero Trust dashboard (dashboard/token-based
  # tunnel), not here.
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      frontend:
        condition: service_healthy
