name: CI

# Runs on every PR (gate for merge) and on push to the long-lived branches
# (safety net — catches anything that slipped past required-checks config).
# All jobs run on GitHub-hosted runners: CI is stateless and disposable, so
# there's no reason to burn time on the self-hosted deploy box for it.

on:
  pull_request:
    branches: [master, main, develop]
  push:
    branches: [master, main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE_BACKEND: chatcraft-backend
  REGISTRY_IMAGE_FRONTEND: chatcraft-frontend

jobs:
  # ---------------------------------------------------------------------------
  # Backend — lint, format, type-check, vulnerability scan, test
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chatcraft
          POSTGRES_PASSWORD: chatcraft
          POSTGRES_DB: chatcraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatcraft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql+asyncpg://chatcraft:chatcraft@localhost:5432/chatcraft_test
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: sk-ant-test
      OPENAI_API_KEY: sk-test
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install lint/type/audit tools
        run: pip install ruff mypy pip-audit

      - name: Lint (ruff check)
        run: ruff check . --output-format=github

      # This repo uses ruff's own formatter instead of black — running both
      # would just fight over the same lines. `ruff format --check` is the
      # formatting gate.
      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy app --ignore-missing-imports --no-strict-optional

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt --desc

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v --tb=short --junitxml=test-results/junit.xml

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Frontend — type-check, lint, build, vulnerability scan
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ["20"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check --workspace=frontend

      - name: Lint
        run: npm run lint --workspace=frontend

      - name: Dependency vulnerability scan (npm audit)
        run: npm audit --audit-level=high --workspace=frontend

      - name: Build verification
        run: npm run build --workspace=frontend
        env:
          NEXT_PUBLIC_API_URL: https://ci-build-placeholder.invalid
          NEXT_PUBLIC_APP_URL: https://ci-build-placeholder.invalid
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload build output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend/.next/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Docker — build validation + image vulnerability scan (both services)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker build validation (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: backend/Dockerfile
            target: final
          - service: frontend
            context: .
            dockerfile: frontend/Dockerfile
            target: builder  # see docker-compose.prod.yml: "final" standalone stage has a known tracing bug

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: chatcraft-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://ci-build-placeholder.invalid
            NEXT_PUBLIC_APP_URL=https://ci-build-placeholder.invalid
            NEXT_PUBLIC_APP_NAME=Tiertech

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: chatcraft-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------------------
  # E2E — Playwright (chromium only, push to master/main only, best-effort)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend]
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_URL || 'http://localhost:3000' }}
        continue-on-error: true  # non-blocking; failures upload report for review

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Required status check — all blocking jobs must pass before merge
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build, e2e]
    if: always()
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" || "${{ needs.docker-build.result }}" != "success" || ("${{ needs.e2e.result }}" != "success" && "${{ needs.e2e.result }}" != "skipped") ]]; then
            echo "One or more required CI jobs failed"
            exit 1
          fi
          echo "All required CI jobs passed"
