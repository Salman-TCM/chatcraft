name: Validate Secrets

on:
  workflow_dispatch:  # run manually to check secrets are configured
  push:
    paths:
      - ".github/workflows/validate-secrets.yml"

jobs:
  github-secrets:
    name: Validate GitHub Action Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          # Railway
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Vercel
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          MISSING=()

          check() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "  MISSING: $name"
              MISSING+=("$name")
            else
              echo "  OK:      $name"
            fi
          }

          echo "=== Railway ==="
          check "RAILWAY_TOKEN" "$RAILWAY_TOKEN"

          echo ""
          echo "=== Vercel ==="
          check "VERCEL_TOKEN" "$VERCEL_TOKEN"
          check "VERCEL_ORG_ID" "$VERCEL_ORG_ID"
          check "VERCEL_PROJECT_ID" "$VERCEL_PROJECT_ID"

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "ERROR: ${#MISSING[@]} secret(s) missing."
            echo "Add them at: Settings → Secrets → Actions"
            exit 1
          fi

          echo ""
          echo "All secrets present."
