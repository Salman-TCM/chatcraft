name: Deploy → Staging

on:
  push:
    branches: [develop, staging]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, main]

concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend-staging:
    name: Deploy Backend → Railway Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    environment:
      name: staging
      url: ${{ vars.RAILWAY_STAGING_BACKEND_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy backend to staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service backend-staging \
            --detach

      - name: Run migrations on staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway run \
            --service backend-staging \
            alembic upgrade head

      - name: Health check
        env:
          BACKEND_URL: ${{ vars.RAILWAY_STAGING_BACKEND_URL }}
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/health/live" || echo "000")
            if [ "$STATUS" = "200" ]; then echo "Healthy"; exit 0; fi
            sleep 10
          done
          exit 1

  deploy-frontend-staging:
    name: Deploy Frontend → Vercel Preview
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel staging environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=preview \
            --token=$VERCEL_TOKEN \
            --cwd frontend

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel build \
            --token=$VERCEL_TOKEN \
            --cwd frontend

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt \
            --token=$VERCEL_TOKEN \
            --cwd frontend)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview: $PREVIEW_URL"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Preview Deployment\n\n**Frontend:** ${{ steps.deploy.outputs.preview_url }}\n**Backend:** ${{ vars.RAILWAY_STAGING_BACKEND_URL }}`
            })
