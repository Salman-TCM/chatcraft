# =============================================================================
# Public edge: serves the app on both :80 and :443.
#
# Traffic path: browser -> Cloudflare edge (HTTPS termination on CF's cert)
# -> cloudflared tunnel -> nginx :80. Since Cloudflare handles TLS on the
# public edge and the tunnel is the ONLY way in (no host ports published),
# nginx doesn't need to redirect to HTTPS — it just serves content on :80.
#
# The :443 listener is still here for defense-in-depth (someone can trust the
# origin cert and reach nginx :443 through another path, e.g. a Zero Trust
# access rule) and for the ssl_certificate we installed via `ensure_ssl_cert`.
# =============================================================================

# Named location shared by the :80 and :443 server blocks below — DRY the
# frontend proxy config so both TLS-terminated and tunnel traffic behave
# identically without duplicating the proxy_pass block.
map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  https https;
  http http;
}

server {
  listen 80;
  listen [::]:80;
  server_name tiertech.com.bd www.tiertech.com.bd;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Direct proxy to backend for the external health check — cloudflared
  # tunnel routes to http://nginx:80, so this MUST be here (not just :443)
  # or the health check falls through to the frontend and 500s.
  location = /health {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
  }

  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name tiertech.com.bd www.tiertech.com.bd;

  ssl_certificate     /etc/letsencrypt/live/tiertech.com.bd/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tiertech.com.bd/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  include /etc/nginx/snippets/security-headers.conf;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # Direct proxy to backend for the external health check — avoids the
  # Next.js hop (which doesn't own /health) so scripts/deploy/health_check.sh
  # can call GET /health and get the backend's real dependency status.
  # NOTE: no URI after $backend_upstream — nginx's proxy_pass with a variable
  # plus a URI segment has broken semantics; drop the /health and nginx will
  # forward the original request URI ($request_uri = "/health") as-is.
  location = /health {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
  }

  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;
  }
}

# -----------------------------------------------------------------------------
# Internal-only listener — NOT published to the host (see docker-compose.prod
# .yml: nginx exposes 80/443 to the host, this port is reachable only from
# other containers on the "edge" network). The frontend's BACKEND_URL points
# here so a backend blue/green swap never requires touching the frontend.
# -----------------------------------------------------------------------------
server {
  listen 8081;
  server_name _;

  location / {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }
}
