# =============================================================================
# Public edge: HTTP -> HTTPS redirect, ACME challenge, and the sole public
# upstream (frontend). Backend is reached only via Next.js server-side
# rewrites hitting the internal listener below — it is never exposed here.
# =============================================================================

server {
  listen 80;
  listen [::]:80;
  server_name tiertech.com.bd www.tiertech.com.bd;

  # Health check target for `docker compose` (plain HTTP, no cert needed)
  # and for scripts/deploy/health_check.sh before/after a swap.
  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # certbot HTTP-01 challenge — must stay reachable over plain HTTP.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name tiertech.com.bd www.tiertech.com.bd;

  ssl_certificate     /etc/letsencrypt/live/tiertech.com.bd/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tiertech.com.bd/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  include /etc/nginx/snippets/security-headers.conf;

  location = /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location / {
    proxy_pass http://$frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";  # Next.js HMR / websockets, harmless in prod
    proxy_read_timeout 60s;
  }
}

# -----------------------------------------------------------------------------
# Internal-only listener — NOT published to the host (see docker-compose.prod
# .yml: nginx exposes 80/443 to the host, this port is reachable only from
# other containers on the "edge" network). The frontend's BACKEND_URL points
# here so a backend blue/green swap never requires touching the frontend.
# -----------------------------------------------------------------------------
server {
  listen 8081;
  server_name _;

  location / {
    proxy_pass http://$backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
