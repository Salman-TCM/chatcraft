# =============================================================================
# ChatCraft — Nginx edge proxy
#
# The browser only ever talks to this container. Everything else (API calls,
# webhooks, health probes) is proxied to the backend *by the Next.js server*
# (see frontend/next.config.mjs rewrites) over the internal Docker network —
# so this file only needs one public upstream: the frontend.
#
# The backend still gets its own upstream here because the frontend's server-
# side rewrites target http://nginx:8081 (this container, internal listener
# on the "edge" network) rather than a backend container name directly. That
# extra hop is what lets blue/green backend swaps happen without ever
# restarting the frontend container.
# =============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time';

  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  client_max_body_size 25m;   # file uploads

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml application/xml+rss text/javascript image/svg+xml;

  # Upstream target files — these two are the ONLY files the blue/green swap
  # script ever rewrites. Everything else in this directory is static.
  include /etc/nginx/conf.d/upstream-frontend.conf;
  include /etc/nginx/conf.d/upstream-backend.conf;

  include /etc/nginx/conf.d/server.conf;
}
